name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out proposed revision and full baseline history
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up analysis Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned analyzers
        run: python -m pip install -r requirements-ci.txt

      - name: Test comparison and fail on new findings
        env:
          ANALYSIS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ANALYSIS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ANALYSIS_EVENT: ${{ github.event_name }}
        run: |
          python -m unittest tests.test_static_analysis
          if [ "$ANALYSIS_EVENT" = pull_request ]; then
            ANALYSIS_BASE="$(git merge-base "$ANALYSIS_BASE" "$ANALYSIS_HEAD")"
          fi
          python scripts/check_static_analysis.py --base "$ANALYSIS_BASE" --head "$ANALYSIS_HEAD"

  unittest:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check out compatible external plugins
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository_owner }}/termia-plugins
          ref: 39e946463347b63ba5dde6a791da6aac5e44af53
          path: _ci/termia-plugins
          persist-credentials: false

      - name: Configure combined coverage
        run: |
          test -f "$GITHUB_WORKSPACE/_ci/termia-plugins/diagnostics/plugin.json"
          echo "TERMIA_SOURCE_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "TERMIA_PLUGINS_SOURCE=$GITHUB_WORKSPACE/_ci/termia-plugins" >> "$GITHUB_ENV"
          echo "COVERAGE_RCFILE=$GITHUB_WORKSPACE/_ci/termia-plugins/.coveragerc" >> "$GITHUB_ENV"

      - name: Require changelog update
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- CHANGELOG.md | grep -Fxq 'CHANGELOG.md'; then
            echo 'CHANGELOG.md must be updated under Unreleased for every pull request.'
            exit 1
          fi

      - name: Install GTK/VTE and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            python3 \
            python3-venv \
            xvfb \
            xauth \
            dbus \
            xdotool \
            python3-gi \
            python3-cryptography \
            python3-yaml \
            python3-paramiko \
            gir1.2-gtk-4.0 \
            gir1.2-gtksource-5 \
            gir1.2-vte-3.91

      - name: Install quality tools with access to system GTK
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements-ci.txt -r requirements-coverage.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check external plugin Python
        working-directory: _ci/termia-plugins
        run: |
          ruff check --isolated --target-version py310 --ignore-noqa --no-cache .
          bandit --ignore-nosec -r diagnostics package_plugin.py

      - name: Run host unittest with branch coverage and a private GTK display
        run: |
          coverage erase
          coverage run scripts/run_sandbox_tests.py

      - name: Run external plugin and host integration tests
        run: |
          coverage run scripts/run_sandbox_tests.py discover \
            -s "$TERMIA_PLUGINS_SOURCE/termia_plugins_tests" \
            -t "$TERMIA_PLUGINS_SOURCE"

      - name: Generate console and HTML coverage reports
        if: ${{ !cancelled() }}
        run: |
          coverage combine
          coverage report
          coverage html
          coverage json -o htmlcov/coverage.json

      - name: Verify coverage inventory and report separate totals
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("htmlcov/coverage.json").read_text())
          files = {Path(name).resolve(): data for name, data in report["files"].items()}
          roots = {
              "Termia": Path(os.environ["TERMIA_SOURCE_DIR"]) / "src/termia",
              "Diagnostics": Path(os.environ["TERMIA_PLUGINS_SOURCE"]) / "diagnostics/src/termia_diagnostics",
          }
          lines = ["| Scope | Lines | Branches |", "| --- | ---: | ---: |"]
          for label, source in roots.items():
              expected = set(source.rglob("*.py"))
              if not expected or expected - files.keys():
                  raise SystemExit(f"Incomplete production coverage inventory: {label}")
              summaries = [files[path]["summary"] for path in expected]
              totals = {key: sum(item[key] for item in summaries) for key in (
                  "covered_lines", "num_statements", "covered_branches", "num_branches"
              )}
              line_pct = 100 * totals["covered_lines"] / totals["num_statements"]
              branch_pct = 100 * totals["covered_branches"] / totals["num_branches"]
              lines.append(f"| {label} | {line_pct:.2f}% | {branch_pct:.2f}% |")
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(summary)
          PYCODE

      - name: Preserve coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unittest-coverage
          path: htmlcov/
          if-no-files-found: error
          retention-days: 14

      - name: Validate translation catalogs
        run: scripts/compile_translations.py --check

      - name: Compile Python sources
        run: |
          python3 -m py_compile \
            run_termia.py \
            scripts/compile_translations.py \
            src/termia/*.py \
            tests/*.py
          python3 -m compileall -q \
            "$TERMIA_PLUGINS_SOURCE/diagnostics" \
            "$TERMIA_PLUGINS_SOURCE/termia_plugins_tests" \
            "$TERMIA_PLUGINS_SOURCE/package_plugin.py"
